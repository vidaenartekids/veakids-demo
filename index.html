<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VeaKids — Demo para familias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --verde:#9BCB45; --verde-osc:#7DB02B; --verde-txt:#8BC34A;
  --fondo:#F6F6F2; --card:#FFFFFF; --borde:#E8E8E3;
  --texto:#1F2430; --sec:#8A8F98; --azul:#2F6FCF; --azul-claro:#EEF4FB; --azul-borde:#CFE0F3;
  --rojo:#E0443A; --naranja:#F08A2E; --amarillo:#F2B705;
  --rosa:#FBEDEC; --rosa-borde:#F2B9B4;
  --sidebar-activo:#111111;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;font-family:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--fondo);color:var(--texto);font-size:14px}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--azul);outline-offset:2px;border-radius:6px}

.app{display:flex;height:100%}

/* Sidebar */
.sidebar{width:178px;flex-shrink:0;background:var(--verde);display:flex;flex-direction:column;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:14px 14px 12px;border-bottom:1px solid rgba(0,0,0,.08)}
.logo-side{width:44px;height:44px;object-fit:contain;flex-shrink:0}
.logo-top{width:30px;height:30px;object-fit:contain}
.brand-name{font-weight:700;font-size:13px;color:#1b2a10;line-height:1.1}
.brand-sub{font-size:9px;color:#3c5a1a}
.nav{padding:14px 8px;display:flex;flex-direction:column;gap:3px}
.nav-item{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:8px;border:none;background:transparent;color:#1b2a10;font-size:12px;font-weight:500;text-align:left;width:100%}
.nav-item svg{width:15px;height:15px;flex-shrink:0}
.nav-item:hover{background:rgba(255,255,255,.22)}
.nav-item.active{background:var(--sidebar-activo);color:#fff}

/* Main */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:46px;flex-shrink:0;background:var(--card);border-bottom:1px solid var(--borde);display:flex;align-items:center;gap:12px;padding:0 14px}
.menu-btn{display:none;border:none;background:none;color:var(--texto);padding:4px}
.top-who{border-left:1px solid var(--borde);padding-left:10px;line-height:1.15}
.top-who b{font-size:12px;font-weight:600;display:block}
.top-who span{font-size:10px;color:var(--sec)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.bell{border:none;background:none;color:var(--sec);position:relative;padding:3px}
.bell .dot{position:absolute;top:2px;right:2px;width:7px;height:7px;border-radius:50%;background:var(--rojo);border:1.5px solid var(--card)}
.avatar{width:26px;height:26px;border-radius:50%;background:#5BA4E0;color:#fff;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center}

.content{flex:1;overflow-y:auto;padding:12px 16px 40px}
.col{max-width:492px;margin:0 auto}
.col.wide{max-width:590px}

.back{display:inline-flex;align-items:center;gap:5px;border:none;background:none;color:var(--sec);font-size:11px;padding:2px 0}
.back:hover{color:var(--texto)}
.back.blue{color:var(--azul)}
.kicker{font-size:9px;font-weight:600;color:var(--azul);letter-spacing:.08em;margin-top:10px}
.title-row{display:flex;align-items:center;gap:8px;margin-top:2px}
.live{width:7px;height:7px;border-radius:50%;background:var(--verde-txt);margin-left:-15px}
.title{font-size:16px;font-weight:600}
.subtitle{font-size:11px;color:var(--sec);margin-top:1px}

.card{background:var(--card);border:1px solid var(--borde);border-radius:10px}
.obs{background:var(--azul-claro);border:1px solid var(--azul-borde);border-radius:10px;padding:12px 12px 10px;margin-top:14px}
.obs h4{font-size:10px;font-weight:600;color:var(--azul);margin-bottom:8px}
.obs p{font-size:11.5px;line-height:1.55}
.obs small{display:block;font-size:9.5px;color:var(--sec);margin-top:6px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}
.foco{background:var(--rosa);border:1px solid var(--rosa-borde);border-radius:10px;padding:12px;text-align:left;color:var(--texto);transition:transform .15s}
.foco:hover{transform:translateY(-1px)}
.foco .fk{font-size:8px;font-weight:700;letter-spacing:.06em}
.foco .fn{font-size:12px;font-weight:600;margin-top:3px}
.foco .fd{font-size:9.5px;color:var(--sec)}
.foco .fs{margin-top:10px;font-size:15px;font-weight:700}
.foco .fs small{font-size:9px;color:var(--sec);font-weight:400}
.foco .fm{font-size:9px;margin-top:6px}

.dim{padding:12px;text-align:left;color:var(--texto);border:1px solid var(--borde);background:var(--card);border-radius:10px;transition:border-color .15s}
.dim:hover,.dim.sel{border-color:var(--verde)}
.dim-top{display:flex;justify-content:space-between;align-items:center}
.dim-name{font-size:11.5px;font-weight:500}
.pill{font-size:8px;font-weight:600;padding:1px 6px;border-radius:10px;background:var(--rosa);color:var(--rojo);border:1px solid var(--rosa-borde)}
.pill.f2{color:var(--naranja)}
.pval{font-size:18px;font-weight:700;margin-top:4px}
.bar{height:4px;border-radius:2px;background:var(--fondo);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:2px;width:0;transition:width .6s ease}
.estado{font-size:9.5px;margin-top:8px}

.section{margin-top:12px;padding:14px}
.sec-t{font-size:9px;font-weight:600;color:var(--sec);letter-spacing:.06em}

.radar-wrap{position:relative;display:flex;justify-content:center}
.legend{display:flex;justify-content:center;gap:14px;font-size:9.5px;color:var(--sec);margin-top:4px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:7px;height:7px;border-radius:50%;display:inline-block}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.tab{font-size:10.5px;font-weight:500;padding:4px 10px;border-radius:14px;border:1px solid var(--borde);background:var(--card);color:var(--texto)}
.tab.active{background:var(--verde-txt);border-color:var(--verde-txt);color:#fff}
.chart-wrap{position:relative;margin-top:8px}
.tip{position:absolute;pointer-events:none;background:var(--texto);color:var(--card);font-size:10.5px;padding:5px 8px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-120%);opacity:0;transition:opacity .12s}
.tip.on{opacity:1}

.btn-hist{margin-top:12px;width:100%;padding:10px;display:flex;justify-content:center;align-items:center;gap:6px;font-size:11.5px;font-weight:500;color:var(--azul);background:var(--card);border:1px solid var(--borde);border-radius:10px}
.btn-hist:hover{border-color:var(--azul-borde)}

/* Historial */
.hist-item{display:block;width:100%;text-align:left;margin-top:10px;padding:14px;background:var(--card);border:1px solid var(--borde);border-radius:10px;color:var(--texto);transition:border-color .15s}
.hist-item:hover{border-color:var(--azul-borde)}
.hist-item.vig{border-color:var(--azul-borde);box-shadow:0 0 0 1px var(--azul-borde)}
.hist-head{display:flex;justify-content:space-between;align-items:center}
.hist-date{font-size:12px;font-weight:600}
.vigente{font-size:8.5px;font-weight:600;color:var(--azul);background:var(--azul-claro);padding:2px 8px;border-radius:10px}
.hist-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}
.hist-cell{background:var(--fondo);border-radius:7px;padding:7px 4px;text-align:center}
.hist-cell small{display:block;font-size:8px;color:var(--sec)}
.hist-cell b{font-size:12px;font-weight:600}

.demo-tag{display:inline-block;margin-top:12px;font-size:9.5px;font-weight:500;color:var(--sec);background:var(--card);border:1px dashed var(--sec);border-radius:10px;padding:3px 10px}
.note{font-size:10.5px;color:var(--sec);background:var(--card);border:1px dashed var(--borde);border-radius:10px;padding:10px 12px;margin-top:14px}

/* Placeholder */
.empty{margin-top:60px;text-align:center;padding:30px 20px}
.empty h3{font-size:15px;font-weight:600}
.empty p{font-size:12px;color:var(--sec);margin:8px auto 16px;max-width:320px;line-height:1.5}
.btn{border:none;background:var(--verde-txt);color:#fff;font-size:12px;font-weight:500;padding:8px 16px;border-radius:8px}

.backdrop{display:none}

@media (max-width:760px){
  .sidebar{position:fixed;top:0;bottom:0;left:0;z-index:30;transform:translateX(-100%);transition:transform .22s ease;padding-top:env(safe-area-inset-top,0px);width:220px}
  .sidebar.open{transform:none;box-shadow:4px 0 24px rgba(0,0,0,.2)}
  .backdrop.on{display:block;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:20}
  .menu-btn{display:block}
  .content{padding:10px 12px 40px}
  .live{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.mt{margin-top:10px}
.ico{width:15px;height:15px;flex-shrink:0;vertical-align:-3px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tag{font-size:9px;font-weight:500;color:#fff;padding:2px 8px;border-radius:10px}
.chev{position:absolute;right:14px;top:14px;color:var(--sec);font-size:16px}
.hero{display:flex;align-items:center;gap:14px;background:var(--verde);border-radius:14px;padding:16px;color:#1b2a10;margin-top:6px}
.hero-av{width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center}
.hero-av .ico{width:22px;height:22px}
.hero-k{font-size:9px;font-weight:600;letter-spacing:.08em}
.hero-n{font-size:19px;font-weight:700}
.hero-g{font-size:9px;font-weight:600;background:rgba(0,0,0,.1);padding:2px 9px;border-radius:10px}
.rep{position:relative;display:block;width:100%;text-align:left;color:var(--texto);padding:14px 30px 14px 14px;margin-top:12px}
.rep-t{font-size:12px;margin-top:4px;line-height:1.45}
.rep-f{font-size:10px;color:var(--azul)}
.acc{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.acc-i{display:flex;align-items:center;gap:10px;padding:14px;font-size:12px;color:var(--texto);text-align:left}
.acc-i:hover,.rep:hover{border-color:var(--verde)}
.acc-e{width:30px;height:30px;border-radius:8px;background:var(--fondo);display:flex;align-items:center;justify-content:center;font-size:15px}
.pf{display:flex;align-items:center;gap:14px;margin:16px 0 6px}
.pf-av{width:46px;height:46px;border-radius:10px;background:#E6F2D3;color:var(--verde-osc);display:flex;align-items:center;justify-content:center}
.pf-n{font-size:15px;font-weight:600}
.lbl{font-size:9px;font-weight:600;color:var(--sec);letter-spacing:.08em;margin:18px 0 8px}
.lbl.blue{color:var(--azul)}
.sp{display:flex;justify-content:space-between;align-items:center;gap:10px}
.kvs{padding:4px 14px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;font-size:11.5px;border-bottom:1px solid var(--borde)}
.kv:last-child{border-bottom:none}
.kv span{color:var(--sec)} .kv b{font-weight:500;text-align:right}
.gdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--verde-txt);margin-right:6px}
.foot{font-size:10px;color:var(--sec);margin-top:10px;line-height:1.5}
.foot.c{text-align:center;margin-top:16px}
.lnk{border:none;background:none;color:var(--azul);font-size:inherit;padding:0}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:500;padding:5px 10px;border:1px solid var(--borde);border-radius:8px;background:var(--card);margin-top:14px}
.chip .ico{width:12px;height:12px;color:var(--azul)}
.pager{display:flex;justify-content:space-between;align-items:center;font-size:10px;color:var(--sec);margin-top:14px}
.pbtn{font-size:10px;font-weight:500;padding:5px 10px;border:1px solid var(--borde);border-radius:8px;background:var(--card);color:var(--texto)}
.pbtn.off{color:var(--sec);opacity:.6}
.blue-t{color:var(--azul)}
.obs.info{display:flex;gap:10px}
.obs.info .ico{color:var(--azul);margin-top:1px}
.obs.info p{font-size:10.5px}
.btn-blue{display:inline-block;background:#5BA4E0;color:#fff;font-size:11.5px;font-weight:600;padding:8px 14px;border-radius:8px;margin-top:14px;white-space:nowrap}
.btn-blue.off{opacity:.45;margin:0}
.aus{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-top:8px;font-size:12px}
.aus-i{width:32px;height:32px;border-radius:8px;background:var(--azul-claro);color:var(--azul);display:flex;align-items:center;justify-content:center}
.del{margin-left:auto;color:var(--rojo)}
.score{display:flex;align-items:center;gap:16px;padding:16px}
.big{font-size:20px;font-weight:700}
.hab{margin-top:12px;overflow:hidden}
.hab-h{display:flex;align-items:center;gap:10px;padding:12px 14px;font-size:12px}
.hab-h b{font-weight:600}
.hab-p{margin-left:auto;width:42px;height:4px;border-radius:2px;background:var(--fondo);overflow:hidden}
.hab-p i{display:block;height:100%;background:var(--verde-txt)}
.hab-h small{color:var(--sec);font-size:10px}
.hab-r{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;background:rgba(155,203,69,.07);font-size:11.5px;color:var(--sec)}
.hab-r.no{background:rgba(224,68,58,.06)}
.seg{display:flex;border:1px solid var(--borde);border-radius:7px;overflow:hidden;flex-shrink:0;background:var(--card)}
.seg span{font-size:9.5px;font-weight:600;padding:4px 8px;color:var(--texto)}
.seg .ok{background:var(--verde-txt);color:#fff} .seg .bad{background:var(--rojo);color:#fff}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.gal img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.lbl.sp{display:flex}
.lang{display:flex;border:1px solid var(--borde);border-radius:14px;padding:2px;font-size:9px;font-weight:600}
.lang b{background:var(--azul);color:#fff;border-radius:10px;padding:2px 8px} .lang span{padding:2px 8px;color:var(--sec)}
.seg2{display:grid;grid-template-columns:1fr 1fr;background:#EDEEE9;border-radius:9px;padding:3px;margin-top:14px;font-size:11px;text-align:center}
.seg2 b{background:var(--card);border-radius:7px;padding:6px;color:var(--azul);font-weight:500} .seg2 span{padding:6px;color:var(--sec)}
.calc{padding:14px;margin-top:12px;font-size:12px}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px;text-align:center}
.dw{font-size:8.5px;color:var(--sec)}
.dd{font-size:10.5px;padding:5px 0;border-radius:6px;position:relative}
.dd i{position:absolute;left:50%;bottom:1px;width:3px;height:3px;border-radius:50%;background:var(--azul);transform:translateX(-50%)}
.dd.today{background:var(--azul-claro);color:var(--azul);font-weight:600}
.ech{font-size:10px;font-weight:500;padding:4px 12px;border-radius:14px;border:1px solid var(--borde);background:var(--card);color:var(--sec);margin-top:10px}
.ech.on{border-color:var(--azul);color:var(--azul);background:var(--azul-claro)}
.evt{position:relative;display:flex;gap:12px;padding:14px 30px 14px 14px;margin-top:10px}
.evd{width:36px;height:40px;border-radius:8px;background:var(--azul-claro);color:var(--azul);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
.evd small{font-size:7.5px;font-weight:600} .evd b{font-size:14px;line-height:1}
.evt-t{font-size:12px;font-weight:600}
.evt .subtitle .ico{width:11px;height:11px}
.etag{font-size:8.5px;font-weight:500;padding:2px 8px;border-radius:10px;background:var(--fondo);color:var(--sec)}
.etag.or{background:#FDEEDD;color:var(--naranja)} .etag.pu{background:#F1E8FB;color:#8E4FD0}
.cum{padding:14px;margin-top:14px;font-size:12px}
.cum-i{display:flex;align-items:center;gap:12px;font-size:12px}
.cum-d{width:34px;height:34px;border-radius:8px;background:#7FB4E6;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.cum-d small{font-size:6.5px}
.post{overflow:hidden;margin-top:12px}
.post-h{display:flex;align-items:center;gap:10px;padding:10px 12px;font-size:11px}
.post-av{width:24px;height:24px;border-radius:50%;background:var(--verde-txt);color:#fff;font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center}
.post img{width:100%;display:block}
.post-c{font-size:11.5px;padding:10px 12px 0}
.post-l{font-size:10.5px;color:var(--sec);padding:8px 12px 12px}
.post-l .ico{width:13px;height:13px}
.nin-g{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.nin{overflow:hidden}
.nin-top{height:120px;display:flex;align-items:center;justify-content:center;font-size:30px}
.nin-b{padding:10px 12px 14px} .nin-b b{font-size:12px;color:var(--azul);font-weight:600}
.noti{display:flex;gap:12px;padding:12px 14px;margin-top:8px}
.noti>.ico{margin-top:2px;color:var(--sec)}
.noti b{font-size:12px;font-weight:500}
.noti-s{font-size:10.5px;color:var(--azul)}
.msgs{max-width:1060px;margin:0 auto}
.msg-w{display:grid;grid-template-columns:260px 1fr;margin-top:14px;background:var(--card);border:1px solid var(--borde);border-radius:10px;overflow:hidden;min-height:520px}
.msg-l{border-right:1px solid var(--borde);overflow-y:auto;max-height:620px}
.msg-i{display:block;width:100%;text-align:left;border:none;border-bottom:1px solid var(--borde);background:transparent;padding:12px 14px;color:var(--texto);font-size:11.5px}
.msg-i.on{background:var(--azul-claro);box-shadow:inset 3px 0 0 var(--azul)}
.msg-i small{font-size:9px;color:var(--sec)}
.msg-m{display:flex;gap:8px;align-items:flex-start;margin-top:5px;font-size:9.5px;color:var(--sec);line-height:1.4}
.msg-p{font-size:9.5px;color:var(--sec);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kind{font-size:8.5px;font-weight:600;padding:2px 7px;border-radius:10px;background:#F1E8FB;color:#8E4FD0;flex-shrink:0}
.kind.g{background:#E6F2D3;color:var(--verde-osc)}
.msg-d{display:flex;flex-direction:column;padding:18px}
.msg-d h2{font-size:17px;font-weight:600}
.msg-meta{font-size:10.5px;color:var(--sec);margin-top:4px}
.msg-meta b{color:var(--texto);font-weight:600}
.msg-b{flex:1;background:var(--fondo);border-radius:8px;padding:16px;margin-top:14px;font-size:12px;line-height:1.6}
.msg-r{display:flex;flex-direction:column;align-items:flex-end;gap:8px;margin-top:12px}
.inp{width:100%;border:1px solid var(--borde);border-radius:8px;padding:10px 12px;font-size:11.5px;color:var(--sec)}
@media (max-width:760px){
  .msg-w{grid-template-columns:1fr}
  .msg-l{border-right:none;border-bottom:1px solid var(--borde);max-height:300px}
  .acc,.nin-g{grid-template-columns:1fr 1fr}
  .nin-top{height:90px}
}
@media (max-width:420px){.acc,.nin-g{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">

// ─── Estado ───
const S = {seccion:"Inicio", vista:"resultados", evalIdx:0, tab:1};

function nivel(p){
  if(p>=80) return {color:"var(--verde-txt)", txt:"Desarrollo esperado"};
  if(p>=45) return {color:"var(--amarillo)", txt:"En proceso"};
  return {color:"var(--naranja)", txt:"Requiere apoyo"};
}
const histColor = p => nivel(p).color;
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

// ─── Navegación lateral ───
function renderNav(){
  $("#nav").innerHTML = NAV.map(([n,ic])=>`
    <button class="nav-item ${S.seccion===n?"active":""}" data-go="${n}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ic}</svg>${n}
    </button>`).join("");
}
document.addEventListener("click", e=>{
  const g = e.target.closest("[data-go]");
  if(g){ S.seccion=g.dataset.go; S.vista="resultados"; S.evalIdx=0; closeMenu(); render(); }
});
const closeMenu=()=>{$("#sidebar").classList.remove("open");$("#backdrop").classList.remove("on");};
$("#menuBtn").onclick=()=>{$("#sidebar").classList.add("open");$("#backdrop").classList.add("on");};
$("#backdrop").onclick=closeMenu;

// ─── Vistas ───
function render(){
  renderNav();
  const c = $("#content"); c.scrollTop=0;
  if(S.seccion!=="Progreso"){ c.innerHTML = (MODS[S.seccion]||placeholder)(S.seccion); return; }
  if(S.vista==="historial"){ c.innerHTML = historial(); return; }
  c.innerHTML = resultados();
  requestAnimationFrame(()=>{
    document.querySelectorAll(".bar i").forEach(b=>b.style.width=b.dataset.w+"%");
    drawRadar(); drawLine();
  });
}

function placeholder(n){
  return `<div class="col"><div class="card empty">
    <h3>${n}</h3>
    <p>Esta sección ya está en la app. En esta demostración puedes explorar el progreso de tu hijo/a: resultados, evolución e historial.</p>
    <button class="btn" data-go="Progreso">Ver progreso</button>
  </div></div>`;
}

function resultados(){
  const ev = EVALS[S.evalIdx], vig = S.evalIdx===0;
  const focoDe = i => ev.focos.find(f=>f.dim===i);
  const dimCard = i => {
    const p = ev.v[i], n = nivel(p), f = focoDe(i);
    return `<button class="dim ${S.tab===i?"sel":""}" data-tab="${i}" title="Ver evolución de ${DIMS[i].nombre}">
      <div class="dim-top"><span class="dim-name">${DIMS[i].nombre}</span>${f?`<span class="pill ${f.n===2?"f2":""}">Foco ${f.n}</span>`:""}</div>
      <div class="pval" style="color:${n.color}">p${p}</div>
      <div class="bar"><i data-w="${p}" style="background:${n.color}"></i></div>
      <div class="estado" style="color:${n.color}">${n.txt}</div>
    </button>`;
  };
  return `<div class="col">
    <button class="back" id="backProg">← ${vig?"Volver a Progreso":"Volver al historial"}</button>
    <div class="kicker">RESULTADOS</div>
    <div class="title-row"><span class="live"></span><h1 class="title">Bruno Pérez</h1></div>
    <div class="subtitle">${ev.fecha} · 5 años</div>

    ${ev.ejemplo ? `<div class="demo-tag">Datos de ejemplo para la demostración</div>` : ""}
    <div class="obs"><h4>Observación del equipo</h4><p>${esc(ev.obs)}</p><small>Evaluación del ${ev.fecha}</small></div>
    <div class="grid2">${ev.focos.map(f=>`
      <button class="foco" data-tab="${f.dim}">
        <div class="fk" style="color:${FOCO_COLOR[f.n]}">FOCO ${f.n}</div>
        <div class="fn">${DIMS[f.dim].nombre}</div>
        <div class="fd">${DIMS[f.dim].largo}</div>
        <div class="fs" style="color:${FOCO_COLOR[f.n]}">${f.puntaje} <small>/12</small></div>
        <div class="fm">Meta: 90 días</div>
      </button>`).join("")}
    </div>

    <div class="grid2">${[0,1,2,3].map(dimCard).join("")}</div>

    <div class="card section">
      <div class="sec-t">PERFIL DE DESARROLLO</div>
      <div class="radar-wrap"><svg id="radar" width="100%" viewBox="0 0 320 190" style="max-width:360px"></svg><div class="tip" id="rtip"></div></div>
      <div class="legend"><span><i style="background:var(--azul)"></i>Tu hijo/a</span><span><i style="background:#B8BCC4"></i>Estándar VEA (próximamente)</span></div>
    </div>

    <div class="card section">
      <div class="sec-t">EVOLUCIÓN</div>
      <div class="tabs">${DIMS.map((d,i)=>`<button class="tab ${S.tab===i?"active":""}" data-tab="${i}">${d.nombre}</button>`).join("")}</div>
      <div class="chart-wrap"><svg id="line" width="100%" viewBox="0 0 440 170"></svg><div class="tip" id="ltip"></div></div>
    </div>

    <button class="btn-hist" id="btnHist">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Ver historial
    </button>
  </div>`;
}

function historial(){
  return `<div class="col wide">
    <button class="back" data-go="Progreso">← Volver a Progreso</button><br>
    <button class="back blue" id="backRes" style="margin-top:8px">‹ Volver</button>
    <div class="kicker">HISTORIAL</div>
    <div class="title-row"><span class="live"></span><h1 class="title">Bruno Pérez</h1></div>
    <div class="subtitle">${EVALS.length} evaluaciones · toca una para ver el detalle</div>
    ${EVALS.map((e,idx)=>`
      <button class="hist-item ${idx===0?"vig":""}" data-eval="${idx}">
        <div class="hist-head"><span class="hist-date">${e.fecha}</span>${idx===0?'<span class="vigente">Vigente</span>':""}</div>
        <div class="hist-grid">${DIMS.map((d,i)=>`<div class="hist-cell"><small>${d.corto}</small><b style="color:${histColor(e.v[i])}">p${e.v[i]}</b></div>`).join("")}</div>
      </button>`).join("")}
  </div>`;
}

// Eventos del contenido
$("#content").addEventListener("click", e=>{
  const t = e.target.closest("[data-tab]");
  if(t){
    S.tab=+t.dataset.tab;
    document.querySelectorAll(".tab").forEach((b)=>b.classList.toggle("active",+b.dataset.tab===S.tab));
    document.querySelectorAll(".dim").forEach((b)=>b.classList.toggle("sel",+b.dataset.tab===S.tab));
    drawLine();
    if(t.classList.contains("dim")||t.classList.contains("foco")) $("#line").scrollIntoView({behavior:"smooth",block:"center"});
    return;
  }
  const ev = e.target.closest("[data-eval]");
  if(ev){ S.evalIdx=+ev.dataset.eval; S.vista="resultados"; render(); return; }
  if(e.target.closest("#btnHist")){ S.vista="historial"; render(); return; }
  if(e.target.closest("#backRes")){ S.vista="resultados"; S.evalIdx=0; render(); return; }
  if(e.target.closest("#backProg")){
    if(S.evalIdx!==0){ S.vista="historial"; render(); } else { $("#content").scrollTo({top:0,behavior:"smooth"}); }
  }
});

// ─── Radar (4 ejes) ───
function drawRadar(){
  const svg=$("#radar"), tip=$("#rtip"), v=EVALS[S.evalIdx].v;
  const cx=160, cy=95, R=62;
  const ang=[-90,0,90,180].map(a=>a*Math.PI/180);
  const pt=(i,p)=>[cx+R*p/100*Math.cos(ang[i]), cy+R*p/100*Math.sin(ang[i])];
  let h="";
  [25,50,75,100].forEach(r=>{
    h+=`<polygon points="${[0,1,2,3].map(i=>pt(i,r).join(",")).join(" ")}" fill="none" stroke="#D9DBE0" stroke-width="0.8"/>`;
  });
  [0,1,2,3].forEach(i=>{const [x,y]=pt(i,100);h+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#D9DBE0" stroke-width="0.8"/>`;});
  const lab=[[cx,cy-R-8,"middle"],[cx+R+8,cy+3,"start"],[cx,cy+R+14,"middle"],[cx-R-8,cy+3,"end"]];
  DIMS.forEach((d,i)=>h+=`<text x="${lab[i][0]}" y="${lab[i][1]}" text-anchor="${lab[i][2]}" font-size="7.5" fill="#8A8F98" font-family="Poppins,sans-serif">${d.nombre}</text>`);
  const poly=[0,1,2,3].map(i=>pt(i,v[i]).join(",")).join(" ");
  h+=`<polygon id="rpoly" points="${[0,1,2,3].map(()=>cx+","+cy).join(" ")}" fill="rgba(47,111,207,.18)" stroke="#2F6FCF" stroke-width="1.4" stroke-linejoin="round">
        <animate attributeName="points" from="${[0,1,2,3].map(()=>cx+","+cy).join(" ")}" to="${poly}" dur=".5s" fill="freeze"/></polygon>`;
  [0,1,2,3].forEach(i=>{const [x,y]=pt(i,v[i]);h+=`<circle cx="${x}" cy="${y}" r="7" fill="transparent" data-i="${i}" style="cursor:pointer"/><circle cx="${x}" cy="${y}" r="2.6" fill="#2F6FCF" pointer-events="none"/>`;});
  svg.innerHTML=h;
  svg.querySelectorAll("circle[data-i]").forEach(c=>{
    const show=()=>{const i=+c.dataset.i,b=svg.getBoundingClientRect(),s=b.width/320;
      tip.textContent=`${DIMS[i].nombre}: p${v[i]}`;tip.style.left=(svg.offsetLeft+c.cx.baseVal.value*s)+"px";tip.style.top=(c.cy.baseVal.value*s)+"px";tip.classList.add("on");};
    c.addEventListener("mouseenter",show);c.addEventListener("click",show);c.addEventListener("mouseleave",()=>tip.classList.remove("on"));
  });
}

// ─── Línea de evolución ───
function drawLine(){
  const svg=$("#line"); if(!svg) return; const tip=$("#ltip");
  const serie=EVALS.slice(0,5).reverse(); // últimas 5, de más antigua a más reciente
  const vals=serie.map(e=>e.v[S.tab]);
  const W=440,H=170,pl=26,pr=12,pt=10,pb=24,cw=W-pl-pr,ch=H-pt-pb;
  const X=i=>pl+cw*i/(vals.length-1), Y=p=>pt+ch*(1-p/100);
  const col = S.tab===0? "#8BC34A" : "#8BC34A";
  let h="";
  [0,25,50,75,100].forEach(g=>h+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(g)}" y2="${Y(g)}" stroke="#ECEDEF" stroke-width="0.8"/><text x="${pl-5}" y="${Y(g)+3}" font-size="7.5" text-anchor="end" fill="#8A8F98" font-family="Poppins,sans-serif">${g}</text>`);
  vals.forEach((_,i)=>h+=`<line x1="${X(i)}" x2="${X(i)}" y1="${pt}" y2="${pt+ch}" stroke="#F1F2F4" stroke-width="0.8"/><text x="${X(i)}" y="${H-8}" font-size="7.5" text-anchor="middle" fill="#8A8F98" font-family="Poppins,sans-serif">${serie[i].corta}</text>`);
  h+=`<line x1="${pl}" x2="${pl}" y1="${pt}" y2="${pt+ch}" stroke="#9AA0AA" stroke-width="0.8"/><line x1="${pl}" x2="${W-pr}" y1="${pt+ch}" y2="${pt+ch}" stroke="#9AA0AA" stroke-width="0.8"/>`;
  // curva suave (Catmull-Rom → Bézier)
  const P=vals.map((p,i)=>[X(i),Y(p)]);
  let d=`M${P[0][0]},${P[0][1]}`;
  for(let i=0;i<P.length-1;i++){
    const p0=P[i-1]||P[i],p1=P[i],p2=P[i+1],p3=P[i+2]||p2;
    d+=` C${p1[0]+(p2[0]-p0[0])/6},${p1[1]+(p2[1]-p0[1])/6} ${p2[0]-(p3[0]-p1[0])/6},${p2[1]-(p3[1]-p1[1])/6} ${p2[0]},${p2[1]}`;
  }
  h+=`<path d="${d}" fill="none" stroke="${col}" stroke-width="1.6" stroke-dasharray="1000" stroke-dashoffset="1000"><animate attributeName="stroke-dashoffset" from="1000" to="0" dur=".7s" fill="freeze"/></path>`;
  P.forEach(([x,y],i)=>h+=`<circle cx="${x}" cy="${y}" r="2.8" fill="${col}" pointer-events="none"/><circle cx="${x}" cy="${y}" r="10" fill="transparent" data-i="${i}" style="cursor:pointer"/>`);
  svg.innerHTML=h;
  svg.querySelectorAll("circle[data-i]").forEach(c=>{
    const show=()=>{const i=+c.dataset.i,s=svg.getBoundingClientRect().width/W;
      tip.textContent=`${serie[i].fecha} · ${DIMS[S.tab].nombre}: p${vals[i]}`;
      tip.style.left=(c.cx.baseVal.value*s)+"px";tip.style.top=(c.cy.baseVal.value*s)+"px";tip.classList.add("on");};
    c.addEventListener("mouseenter",show);c.addEventListener("click",show);c.addEventListener("mouseleave",()=>tip.classList.remove("on"));
  });

"Calendario":()=>{const ev={12:1,13:1,16:1,30:1};let d="";["Lu","Ma","Mi","Ju","Vi","Sa","Do"].forEach(x=>d+=`<span class="dw">${x}</span>`);d+=`<span></span>`;
 for(let i=1;i<=30;i++)d+=`<span class="dd ${i===22?"today":""}">${i}${ev[i]?'<i></i>':""}</span>`;
 const E=(m,n,t,f,h,desc,tg)=>`<div class="card evt"><div class="evd"><small>${m}</small><b>${n}</b></div><div><b class="evt-t">${t}</b><div class="subtitle">${f}</div><div class="subtitle">${ic(I.clock)} ${h}</div>${desc?`<div class="subtitle">${desc}</div>`:""}<div class="tags">${tg}</div></div><span class="chev">›</span></div>`;
 const T=(t,c)=>`<span class="etag ${c||""}">${t}</span>`;
 const pas=E("SEPT","16","Visita al Zoológico","Miércoles, 16 de septiembre de 2026","10:00","Salida pedagógica con el grupo",T("Todos"))+E("SEPT","13","Visita al Museo","Domingo, 13 de septiembre de 2026","14:30","",T("Todos")+T("Gratis","or"))+E("SEPT","12","# 1 Sesión de niñeras","Sábado, 12 de septiembre de 2026","08:00","Fundamentos iniciales",T("Todos")+T("Requiere confirmación","pu"));
 const pro=E("SEPT","30","Reunión de familias","Miércoles, 30 de septiembre de 2026","18:30","Balance del primer trimestre con la maestra",T("Todos")+T("Requiere confirmación","pu"));
 return `<div class="col"><button class="back blue" data-go="Inicio">‹ Inicio</button><div class="sp"><h1 class="title">Calendario</h1><span class="lang"><b>ES</b><span>EN</span></span></div><div class="subtitle">1 próximo</div>
  <div class="seg2"><b>Eventos</b><span>Planeamiento</span></div>
  <div class="card calc"><div class="sp"><span>‹</span><b>Septiembre 2026</b><span>›</span></div><div class="calg">${d}</div></div>
  <div class="tags"><button class="ech ${S.evTab==="pro"?"on":""}" data-evtab="pro">Próximos 1</button><button class="ech ${S.evTab==="pas"?"on":""}" data-evtab="pas">Pasados 3</button></div>
  ${S.evTab==="pro"?pro:pas}</div>`;},

"Cumpleaños":()=>`<div class="col"><button class="back blue" data-go="Inicio">‹ Inicio</button><h1 class="title">Cumpleaños</h1><div class="subtitle">Los cumpleaños del grupo Green Room, mes a mes</div>
  <div class="card cum"><div class="sp"><span>‹</span><b>Septiembre 2026</b><span>›</span></div><div class="subtitle" style="margin:14px 0 8px">1 cumpleaños en septiembre</div>
  <div class="cum-i"><span class="cum-d"><b>2</b><small>SEP</small></span><b>Valentina Ruiz</b></div></div></div>`,

"Red Social":()=>{const P=(img,cap,likes)=>`<div class="card post"><div class="post-h"><span class="post-av">G</span><div><b>Green Room</b><div class="subtitle">04 de septiembre de 2026</div></div></div><img src="${img}" alt="${cap||"Foto del grupo"}">${cap?`<div class="post-c">${cap}</div>`:""}<div class="post-l">${ic(I.heart)} Me gusta · ${likes}</div></div>`;
 return `<div class="col"><h1 class="title mt">Red Social VEA</h1><div class="subtitle">Fotos del grupo de tu hijo</div>${P(IMG.p1,"Nuestro plan de septiembre: Jack and the Beanstalk 🌱",14)}${P(IMG.p2,"¡Así celebramos el inicio del mes!",21)}</div>`;},

"Niñeras":()=>{const t=(bg,e,n,d)=>`<div class="card nin"><div class="nin-top" style="background:${bg}">${e}</div><div class="nin-b"><b>${n}</b><div class="subtitle">${d}</div></div></div>`;
 return `<div class="col wide"><button class="back blue" data-go="Inicio">‹ Inicio</button><h1 class="title">Entrenamiento de niñeras</h1><div class="subtitle">Para alinear el cuidado en casa con lo que trabajamos en el kínder. Las sesiones son abiertas a niñeras y a padres.</div>
  <div class="nin-g">${t("#1E63B0","💡","Recomendaciones","Lo que recomendamos trabajar en casa después de cada sesión.")}${t("#F08A2E","📅","Calendario","Las fechas de las sesiones presenciales del mes.")}${t("#1E63B0","📘","Guías de entrenamiento de niñeras","Los materiales de apoyo que entregamos cada mes.")}${t("#9BCB45","🧩","Juegos","Juegos y actividades para hacer en casa.")}</div></div>`;},

"Notificaciones":()=>{const N=[[I.cal,"📅 # 1 Sesión de niñeras","12 sept 2026: Fundamentos iniciales","11 sept 2026"],[I.box,"Nueva foto en el Cofre","Hay una foto nueva en el Cofre del Tesoro de Bruno Pérez.","4 sept 2026"],[I.box,"Nueva foto en el Cofre","Hay una foto nueva en el Cofre del Tesoro de Bruno Pérez.","4 sept 2026"],[I.doc,"📅 Nuestro plan para septiembre","Planeamiento mensual: Jack and the Beanstalk","4 sept 2026"],[I.cal,"📅 Visita al Zoológico","16 sept 2026: Visita al Zoológico","2 sept 2026"],[I.cal,"📅 Visita al Museo","13 sept 2026","2 sept 2026"],[I.doc,"📅 Nuestro plan para agosto","Planeamiento mensual: Nuestro plan para agosto","31 ago 2026"]];
 return `<div class="col wide"><h1 class="title mt">Notificaciones</h1><div class="subtitle">Los avisos que te ha enviado la app, guardados para que no se pierdan.</div>
  <div class="sp" style="margin-top:14px"><span class="subtitle">Todo leído</span><span class="pbtn">Seleccionar</span></div>
  ${N.map(n=>`<div class="card noti">${ic(n[0])}<div><b>${n[1]}</b><div class="noti-s">${n[2]}</div><div class="subtitle">${n[3]}</div></div></div>`).join("")}</div>`;},

"Mensajes":()=>{const m=MSGS[S.msg];
 return `<div class="msgs"><div class="sp"><h1 class="title" style="font-size:22px">Mensajes</h1><span class="btn-blue">+ Nuevo mensaje</span></div>
  <div class="msg-w"><div class="msg-l">${MSGS.map((x,i)=>`<button class="msg-i ${i===S.msg?"on":""}" data-msg="${i}"><div class="sp"><b>${x.t}</b><small>${x.h}</small></div><div class="msg-m"><span class="kind ${x.k==="Grupo"?"g":""}">${x.k}</span><div>De: ${x.de}<br>Para: ${x.para}${x.nino?`<br>Niño/a: ${x.nino}`:""}</div></div><div class="msg-p">${x.body}</div></button>`).join("")}</div>
  <div class="msg-d"><div class="sp"><h2>${m.t}</h2><span class="kind ${m.k==="Grupo"?"g":""}">${m.k}</span></div><div class="msg-meta">De: <b>${m.deN}</b> · Para: <b>${m.para==="Tú"?"Pablo Pérez":m.para}</b>${m.nino?` · Niño/a: <b>${m.nino}</b>`:""} · ${m.fecha}</div>
  <div class="msg-b">${m.body}</div><div class="msg-r"><div class="inp">Escribe una respuesta…</div><span class="btn-blue off">Responder</span></div></div></div></div>`;}
};
document.getElementById("content").addEventListener("click",e=>{
  const m=e.target.closest("[data-msg]"); if(m){S.msg=+m.dataset.msg;render();return;}
  const t=e.target.closest("[data-evtab]"); if(t){S.evTab=t.dataset.evtab;render();}
});

render();
</script>
</body>
</html>
